<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../css/style.css">
        <link rel="manifest" href="../manifest.json">

        <title>Student Task Planner</title>
    </head>
    
    <body>
        <div class="container">
            <button id="logoutBtn">
                Logout
            </button>
            
            <h1>Student Task Planner</h1>

            <form id="taskForm">
                <input id="taskInput" placeholder="Enter a task">
                <button class="add-btn" type="submit">Add Task</button>
            </form>

            <ul id="taskList"></ul>
        </div>
    </body>

    <script type="module" src="../js/planner.js"></script>
    <script type="module" src="../js/register-sw.js"></script>
</html>
